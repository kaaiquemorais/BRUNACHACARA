[build]
  publish = "."

# ---------------------------------------------------------------------------
# Bloqueio do que nao e site
#
# O publish dir e a raiz do projeto, entao o Netlify sobe TUDO o que esta na
# pasta, inclusive o que o .gitignore ignora: o .gitignore vale para o Git, nao
# para o deploy. Sem estas regras, as fotos originais e o CLAUDE.md ficam
# publicamente baixaveis.
#
# Duas coisas aprendidas testando contra o site publicado:
#
# 1. force = true e obrigatorio. Sem ele, um arquivo que existe de verdade
#    naquele caminho vence a regra.
# 2. O splat precisa ser o FIM do padrao. Padroes como "/*.jpg" nao pegam nada:
#    por isso todo material de origem mora dentro de IMAGENS/, que e bloqueada
#    de uma vez pela regra abaixo. Imagem original nova vai para la, nunca
#    para a raiz do projeto.
# ---------------------------------------------------------------------------

[[redirects]]
  from = "/IMAGENS/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/CLAUDE.md"
  to = "/404.html"
  status = 404
  force = true

# ---------------------------------------------------------------------------
# Cache
# ---------------------------------------------------------------------------

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
