<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Página não encontrada | Chácara Vista Panorâmica</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Plus+Jakarta+Sans:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{--sol-900:#2A1A12;--sol-700:#6B3A1E;--sol-600:#A0522D;--sol-500:#C87A3E;--sol-200:#F8D3A3;--papel:#FDF8F2}
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    min-height:100svh;display:grid;place-items:center;padding:26px;text-align:center;
    font-family:'Plus Jakarta Sans',-apple-system,'Segoe UI',sans-serif;font-size:15.5px;line-height:1.62;
    background:linear-gradient(160deg,var(--sol-900),var(--sol-700) 70%,var(--sol-600));color:#fff;
  }
  .caixa{max-width:460px}
  h1{font-family:'Fraunces',Georgia,serif;font-weight:600;font-size:clamp(1.6rem,4vw,2.1rem);line-height:1.28;letter-spacing:-.01em}
  p{color:rgba(255,255,255,.82);margin-top:14px}
  .cta{
    display:inline-block;margin-top:26px;padding:13px 26px;border-radius:100px;
    font-weight:700;font-size:.89rem;text-decoration:none;color:#fff;
    background:linear-gradient(135deg,var(--sol-600),var(--sol-500));
    box-shadow:0 10px 26px -10px rgba(200,122,62,.65);
    transition:transform .25s cubic-bezier(.34,1.4,.5,1),box-shadow .25s;
  }
  .cta:hover{transform:translateY(-3px);box-shadow:0 18px 34px -12px rgba(200,122,62,.75)}
  .selo{
    display:inline-block;font-size:.7rem;font-weight:700;letter-spacing:.18em;text-transform:uppercase;
    color:var(--sol-200);margin-bottom:14px;
  }
</style>
</head>
<body>
  <div class="caixa">
    <span class="selo">Chácara Vista Panorâmica</span>
    <h1>Esta página não existe</h1>
    <p>O endereço que você acessou não está disponível. Volte para a página inicial para ver as fotos, as comodidades e consultar a disponibilidade.</p>
    <a class="cta" href="/">Ir para a página inicial</a>
  </div>
</body>
</html>
